name: Deploy to Dev

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: dev
      ref:
        required: true
      issue_key:
        required: false
      pr_number:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Deploy
        run: echo "Deploying ${{ inputs.issue_key }} to ${{ inputs.environment }}"
